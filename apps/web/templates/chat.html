{% extends "base.html" %}
{% block title %}اسأل المحتوى — مجمّع أخبار الذكاء الاصطناعي{% endblock %}
{% block content %}
  <h1>اسأل المحتوى</h1>
  <p class="chat-hint">اسأل أي سؤال عن المحتوى التعليمي المجمّع (فيديوهات، مقالات، أوراق arXiv) — الإجابة تُبنى فقط على المصادر المفهرسة، مع اقتباسات وروابط لكل مصدر.</p>

  <div id="chat-window" class="chat-window"></div>

  <form id="chat-form" class="chat-form">
    <input type="text" id="question" name="question" placeholder="مثلاً: وش الفرق بين attention وself-attention؟" required autocomplete="off">
    <button type="submit" id="ask-button">اسأل</button>
  </form>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('question');
    const button = document.getElementById('ask-button');

    function appendMessage(role, html) {
      const el = document.createElement('div');
      el.className = 'chat-message ' + role;
      el.innerHTML = html;
      chatWindow.appendChild(el);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return el;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      appendMessage('user', escapeHtml(question));
      input.value = '';
      button.disabled = true;
      const thinking = appendMessage('assistant', 'يفكر...');

      try {
        const formData = new FormData();
        formData.append('question', question);
        const response = await fetch('/chat/ask', { method: 'POST', body: formData });
        const data = await response.json();

        thinking.innerHTML = escapeHtml(data.answer).replace(/\n/g, '<br>');

        if (data.sources && data.sources.length) {
          const list = document.createElement('ul');
          list.className = 'citations';
          data.sources.forEach((s, i) => {
            const item = document.createElement('li');
            item.append(`[${i + 1}] `);

            const link = document.createElement('a');
            // Build the link via DOM properties, not string-concatenated HTML —
            // s.url/s.title come from scraped article pages, and innerHTML with
            // an unescaped href was a stored-XSS vector (a crafted href could
            // break out of the attribute). Only allow http(s) targets.
            link.href = /^https?:\/\//i.test(s.url) ? s.url : '#';
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = s.title;
            item.appendChild(link);
            list.appendChild(item);
          });
          thinking.appendChild(list);
        }
      } catch (err) {
        thinking.textContent = 'صار خطأ، جرب مرة ثانية.';
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
{% endblock %}
