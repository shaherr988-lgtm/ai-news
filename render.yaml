services:
  # Web UI (sources/articles/digests/chat) + the /internal/run-daily trigger
  # a free external cron service calls once a day — Render's own Cron Job
  # service has no free tier, so there's no separate cron service here.
  - name: ai-news-web
    type: web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    # No dockerCommand override here on purpose: the Dockerfile's own CMD
    # (./docker/start.sh) already creates tables/extension (idempotent) then
    # starts uvicorn. An earlier inline `sh -c "... && ..."` dockerCommand
    # string here got mangled by Render's parsing of the quotes/&&, causing
    # the whole line to be treated as one unrecognized command (exit 127).
    plan: free
    envVars:
      # Neon (free, no expiration) instead of Render's own Postgres, which
      # deletes free databases 30+14 days after creation. Set manually in
      # Render's dashboard to the Neon project's connection string.
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_DIM
        value: "768"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LLM_DAILY_CALL_BUDGET
        value: "15"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: DIGEST_RECIPIENT_EMAIL
        sync: false
      - key: BASIC_AUTH_USERNAME
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: RUN_DAILY_TOKEN
        sync: false
