databases:
  - name: ai-news-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: ai_news
    user: ai_news

services:
  # Web UI — sources/articles/digests/chat pages.
  - name: ai-news-web
    type: web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    # Idempotent: creates the pgvector extension + tables if they don't exist
    # yet, every time the service starts — cheap, and means no manual "run
    # create_tables once" step against the Render Postgres instance.
    dockerCommand: >-
      sh -c "python -m scripts.create_tables &&
      uvicorn apps.web.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_DIM
        value: "768"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LLM_DAILY_CALL_BUDGET
        value: "15"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: DIGEST_RECIPIENT_EMAIL
        sync: false
      - key: BASIC_AUTH_USERNAME
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false

  # Daily pipeline — fetch, curate, summarize, embed, build digest, email it.
  # Same image as the web service, different command and schedule.
  - name: ai-news-daily
    type: cron
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: python -m apps.pipeline.run_daily
    schedule: "0 5 * * *" # 05:00 UTC = 08:00 Riyadh
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_DIM
        value: "768"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LLM_DAILY_CALL_BUDGET
        value: "15"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: DIGEST_RECIPIENT_EMAIL
        sync: false
